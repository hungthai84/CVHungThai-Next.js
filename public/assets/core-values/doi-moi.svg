<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- Thân bóng đèn phát sáng màu cam -->
  <path d="M50 22 C37 22 27 32 27 45 C27 54 33 60 37 66 C39 69 40 72 40 75 L60 75 C60 72 61 69 63 66 C67 60 73 54 73 45 C73 32 63 22 50 22 Z" 
        fill="#F59E0B" 
        stroke="#D97706" 
        stroke-width="3" />
  
  <!-- Sợi đốt bên trong nhẹ -->
  <path d="M44 48 C44 42 47 38 50 38 C53 38 56 42 56 48 L44 48 Z" 
        fill="#FEF3C7" 
        opacity="0.8" />
  
  <!-- Đuôi vặn bóng đèn -->
  <rect x="42" y="77" width="16" height="4" rx="2" fill="#D97706" />
  <rect x="43" y="83" width="14" height="4" rx="2" fill="#B45309" />
  <path d="M46 89 C46 91 54 91 54 89 Z" fill="#78350F" />

  <!-- Các tia sáng phát ra xung quanh -->
  <!-- Tia thẳng đứng trên đỉnh -->
  <line x1="50" y1="8" x2="50" y2="15" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round" />
  <!-- Tia trên trái -->
  <line x1="26" y1="18" x2="31" y2="23" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round" />
  <!-- Tia trên phải -->
  <line x1="74" y1="18" x2="69" y2="23" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round" />
  <!-- Tia bên trái -->
  <line x1="14" y1="44" x2="21" y2="44" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round" />
  <!-- Tia bên phải -->
  <line x1="86" y1="44" x2="79" y2="44" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round" />
  <!-- Tia dưới trái -->
  <line x1="20" y1="67" x2="26" y2="63" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
  <!-- Tia dưới phải -->
  <line x1="80" y1="67" x2="74" y2="63" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
</svg>
