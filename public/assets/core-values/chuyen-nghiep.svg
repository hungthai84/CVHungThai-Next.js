<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- Vòng tròn ngoài của bia ngắm -->
  <circle cx="46" cy="54" r="34" stroke="#8B5CF6" stroke-width="5" fill="none" opacity="0.9" />
  
  <!-- Vòng tròn giữa -->
  <circle cx="46" cy="54" r="23" stroke="#7C3AED" stroke-width="4.5" fill="none" />
  
  <!-- Vòng tròn tâm hồng tâm -->
  <circle cx="46" cy="54" r="11" fill="#6D28D9" stroke="#5B21B6" stroke-width="2" />
  <circle cx="46" cy="54" r="4" fill="#FFFFFF" />

  <!-- Mũi tên phi tiêu từ trên phải cắm vào tâm -->
  <!-- Thân mũi tên -->
